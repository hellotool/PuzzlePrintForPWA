<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>哈兔拼图打印 — UI 重设计原型</title>
<meta name="description" content="Material 2 响应式原型：页面流预览、格子级图片操作、底部图片轨道、移动端 BottomSheet" />
<style>
/* ================= 设计系统（Material 2） ================= */
:root {
  /* 色板 — 取自现行 appTheme（Google Blue 600） */
  --md-primary: 217 82% 51%;
  --md-primary-ink: #1a73e8;
  --md-on-primary: #ffffff;
  --md-bg: #f6f8fb;
  --md-surface: #ffffff;
  --md-text: rgba(0, 0, 0, 0.87);
  --md-text-secondary: rgba(0, 0, 0, 0.60);
  --md-text-disabled: rgba(0, 0, 0, 0.38);
  --md-divider: rgba(0, 0, 0, 0.12);
  --md-outline: rgba(0, 0, 0, 0.23);
  --md-hover: rgba(26, 115, 232, 0.08);
  --md-scrim: rgba(0, 0, 0, 0.32);
  /* elevation（M2 阴影基准） */
  --e1: 0 1px 2px rgba(0,0,0,.14), 0 1px 1px rgba(0,0,0,.10);
  --e2: 0 2px 4px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.10);
  --e8: 0 8px 24px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.10);
  --e16: 0 16px 40px rgba(0,0,0,.24);
  /* 间距阶梯：8dp 网格 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px;
  /* 尺寸 */
  --rail-w: 300px; --appbar-h: 56px; --bottombar-h: 64px; --tray-h: 92px;
  --radius-ctl: 4px; --radius-card: 8px; --radius-sheet: 16px;
  --font: Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  /* 动效 */
  --t-standard: .2s cubic-bezier(.4,0,.2,1);
  --t-decelerating: .25s cubic-bezier(0,0,.2,1);
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); color: var(--md-text); background: #eceff3; }
button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }

/* ================= 原型外壳（页头与设备切换） ================= */
.proto-header { max-width: 1140px; margin: 0 auto; padding: var(--s6) var(--s4) var(--s3); }
.proto-header h1 { font-size: 20px; font-weight: 500; }
.proto-header p { color: var(--md-text-secondary); font-size: 13px; margin-top: var(--s1); }
.mode-switch { display: flex; gap: var(--s2); margin-top: var(--s4); }
.mode-switch button {
  padding: 6px 16px; border: 1px solid var(--md-outline); border-radius: 20px;
  font-size: 13px; color: var(--md-text-secondary); background: var(--md-surface);
  transition: var(--t-standard);
}
.mode-switch button[aria-pressed="true"] { border-color: var(--md-primary-ink); color: var(--md-primary-ink); background: var(--md-hover); }
.mode-note { font-size: 12px; color: var(--md-text-disabled); margin-top: var(--s2); min-height: 16px; }
.stage { display: flex; justify-content: center; padding: var(--s4) var(--s4) var(--s8); }

/* ================= 应用窗口（三档形态） ================= */
.app {
  background: var(--md-bg); position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  transition: width var(--t-standard), height var(--t-standard);
}
body[data-mode="desktop"] .app { width: 1080px; height: 720px; border-radius: 10px; box-shadow: var(--e16); }
body[data-mode="tablet"] .app { width: 840px; height: 660px; border-radius: 10px; box-shadow: var(--e16); }
body[data-mode="phone"]  .app { width: 375px; height: 740px; border-radius: 34px; border: 8px solid #202124; box-shadow: var(--e16); }

/* ---------- AppBar（M2：elevation 0 + 底部分隔线，沿用现行主题） ---------- */
.appbar {
  height: var(--appbar-h); flex: none; display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s4); background: var(--md-surface); border-bottom: 1px solid var(--md-divider); z-index: 5;
}
.appbar .title { font-size: 18px; font-weight: 500; flex: none; }
.status-chip {
  font-size: 12px; color: var(--md-text-secondary); border: 1px solid var(--md-divider);
  border-radius: 14px; padding: 5px 12px; white-space: nowrap; background: var(--md-bg);
}
.appbar .spacer { flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  color: var(--md-text-secondary); font-size: 18px; transition: background var(--t-standard);
}
.icon-btn:hover { background: rgba(0,0,0,.06); }
.icon-btn.filled { color: var(--md-primary-ink); }
.btn-outline {
  color: var(--md-primary-ink); border: 1px solid var(--md-primary-ink); border-radius: var(--radius-ctl);
  padding: 7px 16px; font-size: 14px; font-weight: 500; display: inline-flex; gap: var(--s2); align-items: center;
  transition: background var(--t-standard); white-space: nowrap;
}
.btn-outline:hover { background: var(--md-hover); }
.btn-contained {
  background: var(--md-primary-ink); color: var(--md-on-primary); border-radius: var(--radius-ctl);
  padding: 9px 20px; font-size: 14px; font-weight: 500; box-shadow: var(--e1);
  display: inline-flex; gap: var(--s2); align-items: center; transition: var(--t-standard); white-space: nowrap;
}
.btn-contained:hover { box-shadow: var(--e2); background: #1765cc; }
.btn-contained:disabled, .btn-outline:disabled { color: var(--md-text-disabled); border-color: var(--md-divider); box-shadow: none; background: transparent; cursor: default; }

/* ---------- FAB：打印 = 本应用的终点主动作（M2 extended FAB） ---------- */
.fab {
  position: absolute; z-index: 7; display: inline-flex; align-items: center; gap: var(--s2);
  height: 48px; padding: 0 18px; border-radius: 24px;
  background: var(--md-primary-ink); color: var(--md-on-primary); font-size: 14px; font-weight: 500;
  box-shadow: 0 3px 5px rgba(0,0,0,.2), 0 5px 8px rgba(0,0,0,.14);
  right: var(--fab-right, var(--s6)); bottom: var(--fab-bottom, var(--s6));
  transition: box-shadow var(--t-standard), background var(--t-standard), bottom var(--t-standard), right var(--t-standard);
}
.fab:hover { box-shadow: var(--e8); background: #1765cc; }
.fab:disabled { background: rgba(0,0,0,.12); color: var(--md-text-disabled); box-shadow: none; cursor: default; }
body[data-mode="phone"] .fab { display: none; }

/* tablet：调整栏转覆盖，AppBar 出现开关 */
.rail-toggle { display: none; }
body[data-mode="tablet"] .rail-toggle { display: inline-flex; }
body[data-mode="tablet"] .status-chip { display: none; }

/* ---------- 主体：预览 + 调整栏 ---------- */
.body-row { flex: 1; display: flex; min-height: 0; position: relative; }
.preview-scroll { flex: 1; overflow-y: auto; padding: var(--s6); display: flex; flex-direction: column; align-items: center; gap: var(--s6); scrollbar-width: thin; }

.paper-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--s2); }
.paper {
  background: var(--md-surface); box-shadow: var(--e2); border-radius: 2px;
  width: 300px; aspect-ratio: 1 / 1.414; padding: 14px; display: grid; gap: 0;
}
body[data-mode="phone"] .paper { width: 250px; }
.page-label { font-size: 12px; color: var(--md-text-secondary); }

.cell {
  border: 1px dashed rgba(0,0,0,.16); position: relative; padding: 5px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; min-height: 0;
}
.cell.empty { color: var(--md-text-disabled); font-size: 24px; font-weight: 300; }
.cell.empty:hover { border-color: var(--md-primary-ink); color: var(--md-primary-ink); background: var(--md-hover); }
.cell.selected { outline: 2px solid var(--md-primary-ink); outline-offset: -2px; }
.cell-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: var(--s1); z-index: 2; }
.cell-tool {
  background: var(--md-primary-ink); color: #fff; font-size: 11px; border-radius: 12px;
  padding: 3px 10px; box-shadow: var(--e1);
}
.cell-tool.danger { background: #d93025; }

/* ---------- 凭证示意图（内容即预览产物，CSS 绘制） ---------- */
.voucher {
  width: 100%; height: 100%; border-radius: 4px; overflow: hidden; background: #f2f4f7;
  display: flex; flex-direction: column; padding: 9px 9px 7px; gap: 5px; border: 1px solid rgba(0,0,0,.06);
}
.v-head { display: flex; align-items: center; gap: 6px; }
.v-avatar { width: 17px; height: 17px; border-radius: 4px; flex: none; }
.v-name { font-size: 9px; color: var(--md-text-secondary); }
.v-amount { font-size: 16px; font-weight: 600; margin-top: 3px; letter-spacing: .2px; }
.v-kv { display: flex; justify-content: space-between; font-size: 8px; color: var(--md-text-disabled); }
.v-line { height: 5px; border-radius: 3px; background: #dfe3e8; }
.v-bar { margin-top: auto; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 9px; }
.t-wechat .v-avatar, .t-wechat .v-bar { background: #2aae67; }
.t-alipay  .v-avatar, .t-alipay  .v-bar { background: #1677ff; }
.t-bank    .v-avatar, .t-bank    .v-bar { background: #e65100; }

/* ---------- 右侧调整栏 ---------- */
.rail {
  width: var(--rail-w); flex: none; background: var(--md-surface); border-left: 1px solid var(--md-divider);
  overflow-y: auto; padding: var(--s3) var(--s4) var(--s6); z-index: 6;
}
body[data-mode="phone"] .rail { display: none; }
body[data-mode="tablet"] .rail {
  position: absolute; top: 0; right: 0; bottom: 0; box-shadow: var(--e8);
  transform: translateX(100%); transition: transform var(--t-decelerating); border-left: 0;
}
body[data-mode="tablet"].rail-open .rail { transform: none; }
.rail h2 { font-size: 16px; font-weight: 500; padding: var(--s2) 0 var(--s3); }
.group-title { font-size: 12px; font-weight: 500; letter-spacing: .4px; color: var(--md-primary-ink); padding: var(--s5) 0 var(--s2); }
.row-line {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: 11px 2px; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,.06); min-height: 48px;
}
.row-line .sub { font-size: 11px; color: var(--md-text-disabled); }
.field {
  border: 1px solid var(--md-outline); border-radius: var(--radius-ctl); padding: 8px 12px;
  font-size: 13px; color: var(--md-text); display: flex; justify-content: space-between; min-width: 150px;
}
.field::after { content: "▾"; color: var(--md-text-secondary); margin-left: var(--s3); }
.seg { display: flex; border: 1px solid var(--md-outline); border-radius: var(--radius-ctl); overflow: hidden; }
.seg button { padding: 6px 14px; font-size: 12px; color: var(--md-text-secondary); }
.seg button.on { background: var(--md-hover); color: var(--md-primary-ink); font-weight: 500; }
.switch { width: 36px; height: 14px; border-radius: 8px; background: rgba(0,0,0,.26); position: relative; flex: none; transition: background var(--t-standard); }
.switch::after { content: ""; position: absolute; top: -3px; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--e1); transition: var(--t-standard); }
.switch.on { background: rgba(26,115,232,.5); }
.switch.on::after { left: 16px; background: var(--md-primary-ink); }
.stepper { display: flex; align-items: center; gap: var(--s2); }
.stepper button { width: 28px; height: 28px; border-radius: 50%; background: var(--md-bg); border: 1px solid var(--md-divider); font-size: 15px; }
.stepper b { min-width: 20px; text-align: center; font-weight: 500; }

/* ---------- 底部图片轨道 tray ---------- */
.tray {
  flex: none; background: var(--md-surface); border-top: 1px solid var(--md-divider);
  display: flex; align-items: center; gap: var(--s3); padding: 10px var(--s4);
  position: relative; z-index: 5; transition: height var(--t-standard);
}
.tray .grab { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; border-radius: 2px; background: var(--md-outline); }
.tray-items { flex: 1; display: flex; gap: var(--s2); overflow-x: auto; padding-top: var(--s1); }
.thumb {
  width: 52px; height: 52px; border-radius: 6px; flex: none; border: 2px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: #eef1f5; transition: var(--t-standard); position: relative;
}
.thumb:hover { border-color: var(--md-primary-ink); }
.thumb .t-amt { font-size: 9px; font-weight: 600; color: var(--md-text-secondary); }
.thumb .t-dot { width: 14px; height: 14px; border-radius: 50%; }
.thumb.add { border: 2px dashed var(--md-primary-ink); color: var(--md-primary-ink); font-size: 20px; background: var(--md-hover); }
.tray-meta { font-size: 12px; color: var(--md-text-secondary); white-space: nowrap; display: flex; align-items: center; gap: var(--s2); }
body[data-mode="phone"] .tray { display: none; }
.tray.collapsed { height: 34px; padding-top: 12px; }
.tray.collapsed .tray-items, .tray.collapsed .tray-meta { display: none; }
.tray.collapsed::after { content: "图片 · 展开 ▴"; font-size: 12px; color: var(--md-text-secondary); }
body[data-mode="tablet"] .tray { height: 34px; padding-top: 12px; }
body[data-mode="tablet"] .tray:not(.collapsed) { height: var(--tray-h); padding-top: 10px; }
body[data-mode="tablet"] .tray.collapsed .tray-items, body[data-mode="tablet"] .tray.collapsed .tray-meta { display: none; }

/* ---------- 移动端：底部栏 + BottomSheet ---------- */
.bottombar {
  display: none; flex: none; background: var(--md-surface); border-top: 1px solid var(--md-divider);
  align-items: center; gap: var(--s4); padding: var(--s2) var(--s4) calc(var(--s2) + 18px);
}
body[data-mode="phone"] .bottombar { display: flex; height: var(--bottombar-h); }
.bb-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--md-text-secondary); padding: 4px 10px; border-radius: var(--radius-ctl); }
.bb-tab.on { color: var(--md-primary-ink); background: var(--md-hover); }
.scrim { position: absolute; inset: 0; background: var(--md-scrim); opacity: 0; pointer-events: none; transition: opacity var(--t-standard); z-index: 8; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--md-surface);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--e16);
  transform: translateY(105%); transition: transform var(--t-decelerating);
  display: flex; flex-direction: column; max-height: 70%;
}
body.phone-sheet .scrim { opacity: 1; pointer-events: auto; }
body.phone-sheet-images .sheet { transform: none; height: 62%; }
body.phone-sheet-settings .sheet { transform: none; height: 78%; }
.sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--md-outline); margin: 10px auto 4px; flex: none; }
.sheet-head { display: flex; align-items: center; padding: 0 var(--s4) var(--s2); }
.sheet-head h2 { font-size: 15px; font-weight: 500; flex: 1; }
.sheet-body { overflow-y: auto; padding: 0 var(--s4) var(--s6); }
.sheet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.sheet-grid .thumb { width: 100%; aspect-ratio: 1; height: auto; }
#sheet-settings-view { display: none; }
body.phone-sheet-settings #sheet-settings-view { display: block; }
body.phone-sheet-settings #sheet-images-view { display: none; }

/* 焦点可见性（键盘导航） */
:focus-visible { outline: 2px solid var(--md-primary-ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-mode="desktop">

<header class="proto-header">
  <h1>哈兔拼图打印 — UI 重设计原型</h1>
  <p>Material 2 · 预览与图片管理融合：格子级操作 + 底部图片轨道 · 断点 ≥1200 / 900–1200 / &lt;900</p>
  <div class="mode-switch" role="group" aria-label="设备形态切换">
    <button data-mode="desktop" aria-pressed="true">桌面（≥1200）</button>
    <button data-mode="tablet" aria-pressed="false">平板（900–1200）</button>
    <button data-mode="phone" aria-pressed="false">手机（&lt;900）</button>
  </div>
  <p class="mode-note" id="modeNote"></p>
</header>

<main class="stage">
  <div class="app" id="app">

    <!-- AppBar -->
    <div class="appbar">
      <span class="title">哈兔拼图打印</span>
      <span class="status-chip" id="statusChip"></span>
      <span class="spacer"></span>
      <button class="icon-btn rail-toggle" id="railToggle" aria-label="打开调整面板">⚙</button>
      <button class="icon-btn" aria-label="更多选项">⋮</button>
    </div>

    <!-- 主体 -->
    <div class="body-row">
      <div class="preview-scroll" id="preview"></div>

      <!-- 右侧调整栏 -->
      <aside class="rail" id="rail" aria-label="调整">
        <h2>调整</h2>
        <div class="group-title">页面布局</div>
        <div class="row-line"><span>列数</span>
          <span class="stepper"><button data-dim="cols" data-delta="-1">−</button><b id="colsVal">3</b><button data-dim="cols" data-delta="1">＋</button></span>
        </div>
        <div class="row-line"><span>行数</span>
          <span class="stepper"><button data-dim="rows" data-delta="-1">−</button><b id="rowsVal">1</b><button data-dim="rows" data-delta="1">＋</button></span>
        </div>
        <div class="group-title">纸张与边距</div>
        <div class="row-line"><span>纸张尺寸</span><span class="field">A4 (21×29.7cm)</span></div>
        <div class="row-line"><span>页边距</span><span class="field">默认</span></div>
        <div class="row-line"><span>方向</span><span class="seg" id="orientSeg"><button class="on">横向</button><button>纵向</button></span></div>
        <div class="group-title">裁切</div>
        <div class="row-line"><span>裁切网格线</span><button class="switch on" data-switch aria-label="裁切网格线"></button></div>
        <div class="row-line"><span>角线 crop marks</span><button class="switch" data-switch aria-label="角线"></button></div>
        <div class="group-title">预览</div>
        <div class="row-line"><span>彩色模式</span><button class="switch on" data-switch></button></div>
        <div class="sub" style="padding-top:8px">预览选项不会影响最终打印效果</div>
      </aside>

      <div class="scrim" id="railScrimPhone"></div>
    </div>

    <!-- 主操作 FAB（桌面/平板） -->
    <button class="fab" id="fab"><span>🖨</span> 打印</button>

    <!-- 底部图片轨道（桌面/平板） -->
    <footer class="tray collapsed" id="tray">
      <span class="grab" role="button" aria-label="折叠或展开图片轨道" id="trayGrab"></span>
      <div class="tray-items" id="trayItems"></div>
      <div class="tray-meta"><span id="trayMeta"></span><button class="icon-btn" id="trayChevron" aria-label="展开收起">▾</button></div>
    </footer>

    <!-- 移动端 BottomSheet -->
    <div class="scrim" id="sheetScrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="面板">
      <span class="sheet-grab"></span>
      <div id="sheet-images-view">
        <div class="sheet-head"><h2 id="sheetImagesTitle"></h2><button class="btn-contained" style="padding:6px 14px">＋ 添加</button></div>
        <div class="sheet-body sheet-grid" id="sheetGrid"></div>
      </div>
      <div id="sheet-settings-view">
        <div class="sheet-head"><h2>调整</h2></div>
        <div class="sheet-body" id="sheetSettingsBody"></div>
      </div>
    </div>

    <!-- 移动端底部栏 -->
    <nav class="bottombar" aria-label="主操作">
      <button class="bb-tab" data-sheet="images"><span>🖼</span>图片</button>
      <button class="bb-tab" data-sheet="settings"><span>⚙</span>调整</button>
      <span class="spacer" style="flex:1"></span>
      <button class="btn-contained"><span>🖨</span> 打印</button>
    </nav>
  </div>
</main>

<script>
/* ================== 原型状态（数据即演示，非应用逻辑） ================== */
const POOL = [
  { brand: 'wechat', name: '王女士', amount: '¥ 1,200.00', kv: '微信转账 · 10-01 20:14', state: '已收款' },
  { brand: 'alipay', name: '李经理', amount: '¥ 3,500.00', kv: '支付宝转账 · 10-02 11:03', state: '交易成功' },
  { brand: 'wechat', name: '订单 #8841', amount: '¥ 860.00', kv: '订单详情 · 10-03', state: '已支付' },
  { brand: 'alipay',  name: '陈先生', amount: '¥ 450.00', kv: '微信转账 · 10-05 09:40', state: '已收款' },
  { brand: 'bank',    name: '工商银行', amount: '¥ 2,000.00', kv: '电子回单 · 10-06', state: '转账成功' },
  { brand: 'wechat',  name: '赵老师', amount: '¥ 128.00', kv: '微信红包 · 10-08', state: '已领取' },
  { brand: 'alipay',  name: '采购款', amount: '¥ 6,600.00', kv: '支付宝转账 · 10-09 15:22', state: '交易成功' },
];
const BAR = ['即时到账','即时到账','在线支付','即时到账','实时入账','—','即时到账'];
const state = { cols: 3, rows: 1, cells: [...POOL, null, null], selected: null, poolNext: 0 };

const $ = (s) => document.querySelector(s);
const perPage = () => state.cols * state.rows;
const filled = () => state.cells.filter(Boolean).length;
const pages = () => Math.max(1, Math.ceil(filled() / perPage()));

function voucherHTML(v, i) {
  return `<div class="voucher t-${v.brand}">
    <div class="v-head"><span class="v-avatar"></span><span class="v-name">${v.name}</span></div>
    <div class="v-amount">${v.amount}</div>
    <div class="v-kv"><span>${v.kv}</span><span>${v.state}</span></div>
    <div class="v-line" style="width:${60 + (i % 3) * 15}%"></div>
    <div class="v-bar">${BAR[i]}</div>
  </div>`;
}

function render() {
  const pv = $('#preview');
  pv.innerHTML = '';
  const total = pages() * perPage();
  for (let p = 0; p < pages(); p++) {
    const wrap = document.createElement('div'); wrap.className = 'paper-wrap';
    const paper = document.createElement('div'); paper.className = 'paper';
    paper.style.gridTemplateColumns = `repeat(${state.cols},1fr)`;
    paper.style.gridTemplateRows = `repeat(${state.rows},1fr)`;
    for (let c = p * perPage(); c < (p + 1) * perPage() && c < state.cells.length; c++) {
      const v = state.cells[c];
      const cell = document.createElement('div');
      cell.className = 'cell' + (v ? (state.selected === c ? ' selected' : '') : ' empty');
      cell.innerHTML = v ? (state.selected === c
        ? voucherHTML(v, c) + `<div class="cell-tools"><button class="cell-tool" data-rep="${c}">替换</button><button class="cell-tool danger" data-rm="${c}">×</button></div>`
        : voucherHTML(v, c)) : '+';
      cell.dataset.idx = c;
      paper.append(cell);
    }
    wrap.append(paper, Object.assign(document.createElement('div'), { className: 'page-label', textContent: `第 ${p + 1} 页` }));
    pv.append(wrap);
  }
  $('#colsVal').textContent = state.cols;
  $('#rowsVal').textContent = state.rows;
  $('#statusChip').textContent = `A4 · ${state.cols}×${state.rows} · ${filled()} 张 / ${pages()} 页`;
  $('#trayMeta').textContent = `${filled()} 张 · ${pages()} 页`;
  $('#sheetImagesTitle').textContent = `图片（${filled()} 张）`;
  const thumbs = state.cells.map((v, i) => v
    ? `<div class="thumb" data-jump="${i}" title="${v.kv}"><span class="t-dot" style="background:${ {wechat:'#2aae67',alipay:'#1677ff',bank:'#e65100'}[v.brand]}"></span><span class="t-amt">${v.amount.replace('¥ ','')}</span></div>` : '').join('');
  $('#trayItems').innerHTML = thumbs + `<button class="thumb add" id="trayAdd">+</button>`;
  $('#sheetGrid').innerHTML = thumbs + `<button class="thumb add" id="trayAdd">+</button>`;
  $('#sheetSettingsBody').innerHTML = $('#rail').innerHTML;
  $('#fab').disabled = filled() === 0;
}

/* ---------- 交互 ---------- */
$('#preview').addEventListener('click', (e) => {
  const rm = e.target.closest('[data-rm]'); const rep = e.target.closest('[data-rep]');
  const cell = e.target.closest('.cell');
  if (rm) { state.cells[+rm.dataset.rm] = null; state.selected = null; }
  else if (rep) { const i = +rep.dataset.rep; const cand = state.cells.find(v => v && !state.cells.slice(0, i).includes(v)) || POOL[state.poolNext++ % POOL.length]; state.cells[i] = cand; state.selected = i; }
  else if (cell) { const i = +cell.dataset.idx;
    if (!state.cells[i] && state.cells.includes(null)) { const from = state.cells.findIndex(Boolean); /* 轨道拖入简化为补位 */ }
    if (!state.cells[i]) { state.cells[i] = POOL[state.poolNext++ % POOL.length]; state.selected = i; }
    else state.selected = state.selected === i ? null : i; }
  render();
});
$('#trayItems').addEventListener('click', trayClick);
$('#sheetGrid').addEventListener('click', trayClick);
function trayClick(e) {
  const t = e.target.closest('[data-jump]');
  if (t) { const i = +t.dataset.jump; state.selected = i;
    if (document.body.dataset.mode === 'phone') closeSheet();
    document.querySelector(`.cell[data-idx="${i}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  if (e.target.closest('#trayAdd')) { const slot = state.cells.indexOf(null); if (slot >= 0) state.cells[slot] = POOL[state.poolNext++ % POOL.length]; render(); }
}
document.querySelector('.body-row').addEventListener('click', (e) => {
  if (e.target.closest('#railScrimPhone')) { document.body.classList.remove('rail-open'); updateFab(); }
});
$('#railToggle').addEventListener('click', () => {
  document.body.classList.toggle('rail-open');
  const on = document.body.classList.contains('rail-open');
  $('#railScrimPhone').style.cssText = on && document.body.dataset.mode === 'tablet' ? 'opacity:1;pointer-events:auto;position:fixed;inset:0;background:var(--md-scrim);z-index:5' : '';
  updateFab();
});
$('#rail').addEventListener('click', (e) => {
  const st = e.target.closest('[data-dim]');
  if (st) { const d = +st.dataset.delta;
    if (st.dataset.dim === 'cols') state.cols = Math.min(5, Math.max(1, state.cols + d));
    else state.rows = Math.min(4, Math.max(1, state.rows + d)); }
  const sw = e.target.closest('[data-switch]'); if (sw) sw.classList.toggle('on');
  const sg = e.target.closest('.seg button'); if (sg) { sg.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); sg.classList.add('on'); }
  if (st || sw || sg) render();
});
$('#sheet').addEventListener('click', (e) => {
  const st = e.target.closest('[data-dim]');
  if (st) { const d = +st.dataset.delta;
    if (st.dataset.dim === 'cols') state.cols = Math.min(5, Math.max(1, state.cols + d));
    else state.rows = Math.min(4, Math.max(1, state.rows + d)); render(); }
  const sw = e.target.closest('[data-switch]'); if (sw) sw.classList.toggle('on');
});
document.querySelectorAll('.bb-tab').forEach(b => b.addEventListener('click', () => {
  const img = b.dataset.sheet === 'images';
  closeSheet();
  document.body.classList.add('phone-sheet', img ? 'phone-sheet-images' : 'phone-sheet-settings');
  b.classList.add('on');
}));
$('#sheetScrim').addEventListener('click', closeSheet);
function closeSheet() {
  document.body.classList.remove('phone-sheet', 'phone-sheet-images', 'phone-sheet-settings');
  document.querySelectorAll('.bb-tab').forEach(b => b.classList.remove('on'));
}
$('#trayGrab').addEventListener('click', () => { $('#tray').classList.toggle('collapsed'); updateFab(); });
$('#trayChevron').addEventListener('click', () => { $('#tray').classList.toggle('collapsed'); $('#trayChevron').textContent = $('#tray').classList.contains('collapsed') ? '▴' : '▾'; updateFab(); });

/* ---------- FAB 位置：避开调整栏与轨道，随形态/折叠状态联动 ---------- */
function updateFab() {
  const mode = document.body.dataset.mode;
  const collapsed = $('#tray').classList.contains('collapsed');
  const trayH = collapsed ? 34 : 92;
  const railOccupiesRight = mode === 'desktop' || (mode === 'tablet' && document.body.classList.contains('rail-open'));
  const right = railOccupiesRight ? 'calc(var(--rail-w) + var(--s6))' : 'var(--s6)';
  document.documentElement.style.setProperty('--fab-right', right);
  document.documentElement.style.setProperty('--fab-bottom', `calc(${trayH}px + var(--s4))`);
  $('#fab').disabled = filled() === 0;
}
$('#fab').addEventListener('click', () => { if (!$('#fab').disabled) alert('演示：调用浏览器打印（window.print）'); });

/* ---------- 设备形态切换 ---------- */
const NOTES = {
  desktop: '≥1200：打印 = 终点主动作 → 右下角 extended FAB；右侧调整栏常驻；tray 折叠/展开（FAB 随轨道高度联动）；格子选中/替换/移除、空格补位均可点击体验',
  tablet: '900–1200：FAB 保留（贴右缘）；调整栏转覆盖抽屉（⚙ 开关）；tray 默认折叠',
  phone: '<900：全屏预览；底部栏打开图片/调整 BottomSheet；打印按钮进底栏（FAB 取消，避免遮挡）',
};
document.querySelectorAll('.mode-switch button').forEach(b => b.addEventListener('click', () => {
  document.body.dataset.mode = b.dataset.mode;
  document.querySelectorAll('.mode-switch button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#modeNote').textContent = NOTES[b.dataset.mode];
  closeSheet(); document.body.classList.remove('rail-open'); $('#railScrimPhone').style.cssText = '';
  $('#tray').classList.toggle('collapsed', b.dataset.mode === 'tablet');
  updateFab();
}));

$('#modeNote').textContent = NOTES.desktop;
render();
updateFab();
</script>
</body>
</html>
