name: Build Web Version

on:
  workflow_call:
    inputs:
      base:
        description: Base (e.g. /repo/)
        required: false
        type: string
        default: "/"
      artifact-name:
        description: Artifact Name
        required: false
        type: string
        default: "web-build"
  workflow_dispatch:
    inputs:
      base:
        description: Base (e.g. /repo/)
        required: false
        type: string
        default: "/"
      artifact-name:
        description: Artifact Name
        required: false
        type: string
        default: "web-build"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ inputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build:browser --base "${{ inputs.base }}"

      - name: Prepare artifact
        id: prepare_artifact
        run: |
          cd dist/browser
          zip -r ../${{ inputs.artifact-name }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/${{ inputs.artifact-name }}.zip
          if-no-files-found: error
